name: Debug APK → Telegram

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🛡️ Verification & Gauntlet Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    - name: Test Telegram helper
      run: python3 scripts/test_send_telegram.py

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle_test.log

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

    - name: Alert Validation Failure to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        python3 scripts/send_telegram.py \
          --token "$TELEGRAM_BOT_TOKEN" \
          --chat-id "$TELEGRAM_CHAT_ID" \
          --mode alert \
          --sha "$COMMIT_SHA" \
          --logs "gradle_test.log"

  build:
    name: 🚀 Build & Deploy APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Accept Android SDK Licenses & Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "CMAKE_ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: |
        cargo install cargo-ndk
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log

    - name: Lint (hard gate)
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        set -e -o pipefail
        ./gradlew lintDebug --stacktrace 2>&1 | tee gradle_lint.log

    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename APK
      run: |
        APK_SRC=$(find app/build -name "*debug*.apk" -o -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -1)
        if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
          echo "ERROR: No APK found in app/build!"
          find app/build -type f || true
          exit 1
        fi
        echo "Found built APK at: $APK_SRC"
        cp "$APK_SRC" "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"
        ls -lh "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}-debug
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk

    - name: Send APK to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%s)
        COMMIT_SHA=$(git rev-parse --short HEAD)
        python3 scripts/send_telegram.py \
          --token "$TELEGRAM_BOT_TOKEN" \
          --chat-id "$TELEGRAM_CHAT_ID" \
          --mode apk \
          --apk "Aura_Transcribe_v${{ env.VERSION_NAME }}-debug.apk" \
          --version "${{ env.VERSION_NAME }}" \
          --sha "$COMMIT_SHA" \
          --commit-msg "$COMMIT_MSG"

    - name: Print Logs on Failure
      if: failure()
      run: |
        echo "=================== GRADLE BUILD LOG ==================="
        cat gradle_build.log || true
        echo "=================== GRADLE LINT LOG ==================="
        cat gradle_lint.log || true

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-build-logs
        path: |
          *.log
          app/build/reports/

    - name: Alert Build Failure to Telegram
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        COMMIT_SHA=$(git rev-parse --short HEAD)
        python3 scripts/send_telegram.py \
          --token "$TELEGRAM_BOT_TOKEN" \
          --chat-id "$TELEGRAM_CHAT_ID" \
          --mode alert \
          --sha "$COMMIT_SHA" \
          --logs "gradle_build.log,gradle_lint.log"
