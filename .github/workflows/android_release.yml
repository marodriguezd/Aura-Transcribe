name: Build Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: 🛡️ Release Quality & Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run unit tests (hard gate)
      run: ./gradlew testDebugUnitTest

    - name: Run performance & latency benchmarks (optimization gate)
      run: python3 scripts/bench_performance.py

  build-release:
    name: 🚀 Build Signed Release APK
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Accept Android SDK Licenses & Install NDK
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "CMAKE_ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "KEYSTORE_BASE64 secret is missing — cannot sign the release"; exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        test -s release.keystore || { echo "KEYSTORE_BASE64 decoded to an empty keystore — cannot sign the release"; exit 1; }

    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        ./gradlew assembleRelease

    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Verify APK alignment and signature
      run: |
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
        "$BT"zipalign -c 4 "$APK"
        "$BT"apksigner verify --print-certs "$APK" | tee apk-cert.txt
        grep -q 'CN=' apk-cert.txt || { echo "APK is not signed — aborting release"; exit 1; }

    - name: Extract Version Name
      id: extract_version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "Detected Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename Artifacts
      run: |
        cp app/build/outputs/apk/release/app-release.apk Aura_Transcribe_v${{ env.VERSION_NAME }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        name: Aura Transcribe v${{ env.VERSION_NAME }}
        tag_name: v${{ env.VERSION_NAME }}
        body_path: RELEASE_NOTES.md
        files: |
          Aura_Transcribe_v${{ env.VERSION_NAME }}.apk
