name: Build Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; only the publishing job asks for more.
permissions:
  contents: read

jobs:
  validate:
    name: 🛡️ Release Quality & Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: aarch64-linux-android

    - name: Rust format check (hard gate)
      run: cargo fmt --all -- --check

    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev build-essential

    - name: Rust workspace tests (hard gate)
      run: cargo test --workspace

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    # License-scope gate: MIT application code, OpenMDW-1.1 model, notices
    # packaged byte-identically, model download pinned to a verified revision.
    # Its own test suite proves it fails on each specific defect instead of
    # merely always passing.
    - name: License scope and notice consistency (hard gate)
      run: |
        python3 scripts/test_check_license_docs.py
        python3 scripts/check_license_docs.py

    - name: Cargo dependency license inventory
      run: python3 scripts/report_cargo_licenses.py --output build/reports/cargo-licenses.md

    - name: Check translations (i18n parity gate)
      run: python3 scripts/check_translations.py

    - name: Test Telegram helper
      run: python3 scripts/test_send_telegram.py

    - name: Test benchmark suite (hard gate)
      run: python3 scripts/test_benchmark_suite.py

    # Pure Python, no Android SDK involved: proves the release-artifact verifier
    # still rejects a missing, duplicated, misplaced, truncated or corrupted
    # bundled model. This is the check that runs before any artifact exists.
    - name: Test the release-artifact verifier (hard gate)
      run: python3 scripts/test_verify_release_artifact.py

    # JNI integrity gate: every Java `native` declaration must have its Rust
    # export and vice versa (same gate as the debug workflow).
    - name: Check JNI parity (hard gate)
      run: python3 scripts/check_jni_parity.py

    - name: Test the JNI parity gate (hard gate)
      run: python3 scripts/test_check_jni_parity.py

    # Release-notes gate: enforces the 125-250 word limit, single version
    # header, and no accumulated past-release history in RELEASE_NOTES.md.
    - name: Check release notes (hard gate)
      run: python3 scripts/check_release_notes.py

    - name: Test the release-notes gate (hard gate)
      run: python3 scripts/test_check_release_notes.py

    # Signing-identity gate: pure Python with synthetic fingerprints, no keystore
    # and no SDK involved. Proves the verifier accepts a pinned signer and rejects
    # an unpinned one, a mixed set, and malformed input (fails closed).
    - name: Test the signing-identity verifier (hard gate)
      run: python3 scripts/test_verify_signing_identity.py

    # Repository-hygiene gate: fails if agent-session state, build outputs,
    # models, oversized files or secret-shaped tokens are tracked (2026-10 audit,
    # Phase 4). Pure git + Python, no SDK.
    - name: Check repository hygiene (hard gate)
      run: |
        python3 scripts/test_check_repo_hygiene.py
        python3 scripts/check_repo_hygiene.py

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.1

    - name: Generate resolved Gradle dependency license report
      run: ./gradlew --no-parallel :app:generateLicenseReport

    - name: Upload dependency license inventories
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: aura-transcribe-dependency-license-inventories
        path: |
          app/build/reports/dependency-license/**
          build/reports/cargo-licenses.md
        if-no-files-found: error
        retention-days: 30

    # `set -o pipefail` is required: without it the pipeline's exit status is
    # `tee`'s and a failing gate would report success.
    - name: Run unit tests (hard gate)
      run: |
        set -e -o pipefail
        ./gradlew testDebugUnitTest 2>&1 | tee gradle_test.log

    # Drives the real packaging decision and the real model verifier with a table
    # of invocations and synthetic archives — no model download, no native build.
    - name: Verify packaging decision and model gates (hard gate)
      run: |
        set -e -o pipefail
        ./gradlew :app:verifyPackagingDecision 2>&1 | tee gradle_packaging_gate.log

    # Drives the real native-alignment logic (the required project-library set
    # and the per-library verdict) against synthetic inputs — no native build,
    # no SDK. Same logic the artifact gate runs in the build job.
    - name: Verify native-alignment gate logic (hard gate)
      run: |
        set -e -o pipefail
        ./gradlew :app:verifyNativeAlignmentGate 2>&1 | tee gradle_native_gate.log

    # These are reference-algorithm micro-benchmarks on stand-in data: they prove
    # the fast paths still agree with the naive implementations, and they assert
    # those equivalences rather than reporting a made-up speed-up. They are NOT a
    # measurement of on-device inference performance.
    - name: Reference-algorithm micro-benchmarks (correctness gate)
      run: python3 scripts/bench_performance.py

    - name: Print logs on failure
      if: failure()
      run: |
        cat gradle_test.log || true
        cat gradle_packaging_gate.log || true
        cat gradle_native_gate.log || true

  build-release:
    name: 🚀 Build Signed Release Artifacts
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASS: ${{ secrets.STORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Fix gradle.properties for CI
      run: |
        sed -i '/org.gradle.java.home/d' gradle.properties
        sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

    - name: Setup Android SDK & NDK
      run: |
        SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -f "$SDKM" ]; then
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
        fi
        echo "Using sdkmanager at: $SDKM"
        yes | "$SDKM" --licenses || true
        "$SDKM" --install "ndk;28.2.13676358"

        NDK_PATH="$ANDROID_HOME/ndk/28.2.13676358"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "CMAKE_ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: aarch64-linux-android

    - name: Rust Cache
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.8

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Cache cargo-ndk
      id: cache-cargo-ndk
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: ~/.cargo/bin/cargo-ndk
        key: cargo-ndk-4.1.2-${{ runner.os }}

    - name: Install cargo-ndk
      if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
      run: cargo install cargo-ndk --version 4.1.2 --locked

    - name: Configure cargo-ndk PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4.4.1

    # The build can only produce a model-less release APK when the documented
    # escape-hatch property is passed. It exists for local experiments; a release
    # published from CI must never ship without the bundled model, so refuse to
    # build when it appears in a workflow file or in the environment. The needle
    # is assembled from two halves on purpose: written as one literal it would
    # make this guard match its own line.
    - name: Reject the model-less release escape hatch
      run: |
        set -euo pipefail
        NEEDLE="allowModelLess""ReleaseApk=true"
        if grep -rFn -- "$NEEDLE" .github/workflows; then
          echo "::error::the model-less escape hatch is enabled in a workflow; a release must always carry the bundled model"
          exit 1
        fi
        if env | grep -E '^ORG_GRADLE_PROJECT_' | grep -qiE 'allowmodel'; then
          echo "::error::an ORG_GRADLE_PROJECT_ environment variable enables the model-less escape hatch"
          exit 1
        fi
        echo "OK: no model-less escape hatch in this run."

    # Fail before the expensive build rather than letting AGP stop halfway, and
    # never fall back to a debug or default key. Secret values are checked for
    # presence only and are never printed.
    - name: Preflight release signing credentials
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
      run: |
        set -euo pipefail
        missing=0
        for name in KEYSTORE_BASE64 STORE_PASS KEY_ALIAS KEY_PASS; do
          if [ -z "${!name:-}" ]; then
            echo "::error::required release signing secret $name is not set"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Refusing to build a release without the authorized signing credentials."
          exit 1
        fi
        echo "OK: all four release signing secrets are present (values are never echoed)."

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        test -s release.keystore || { echo "::error::KEYSTORE_BASE64 decoded to an empty keystore — cannot sign the release"; exit 1; }

    # Fail fast — before the expensive build — when the release keystore does not
    # hold the pinned production certificate. The expected fingerprint comes from
    # the committed trust anchor (keystore/release-cert.sha256, extracted from the
    # published v1.0.0 APK/AAB), never from the keystore being checked. Only the
    # fingerprint is printed; passwords are never echoed.
    - name: Verify keystore identity against the pinned trust anchor
      env:
        STORE_PASS: ${{ secrets.STORE_PASS }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        KS_SHA=$(keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" \
          -alias "$KEY_ALIAS" 2>/dev/null \
          | grep -oP 'SHA256: \K[0-9A-Fa-f:]+' | tr -d ':' | tr 'A-F' 'a-f' | head -1 || true)
        if [ -z "$KS_SHA" ]; then
          echo "::error::could not read the release certificate from release.keystore (wrong alias or corrupt keystore)"
          exit 1
        fi
        python3 scripts/verify_signing_identity.py --observed "$KS_SHA"

    # The project's declared hard gate. Runs before packaging so a release never
    # depends on another workflow having checked the code.
    - name: Lint (hard gate)
      run: |
        set -e -o pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        ./gradlew :app:lintDebug --stacktrace 2>&1 | tee gradle_lint.log

    # One artifact per invocation, always. Asking for the APK and the AAB in the
    # same Gradle call fails at configuration time, because an APK must carry the
    # bundled GGUF in its base module while an AAB must carry it only in the
    # :model_assets install-time asset pack. `assembleRelease` also runs the
    # `verifyReleaseApkModel` gate, which opens the produced APK and refuses to
    # let the build succeed without the model inside it.
    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        set -euo pipefail
        ./gradlew assembleRelease

    # 16 KB page-size alignment of every shipped .so (Android 17 requirement),
    # run after the APK build so the merged (dependency) libraries are fresh and
    # both project + dependency libs are verified before publication. The gate is
    # self-sufficient: it depends on cargoNdkBuild, so it compiles the project
    # libraries if they do not exist yet and verifies them by name
    # (libandroid_transcribe_app.so AND libc++_shared.so) instead of trusting
    # whatever the merged output happens to contain.
    - name: Verify native alignment (hard gate)
      run: |
        set -e -o pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        ./gradlew :app:checkNativeAlignment 2>&1 | tee gradle_alignment.log

    - name: Verify release APK (alignment, signature, bundled model)
      run: |
        set -euo pipefail
        APK_DIR=app/build/outputs/apk/release
        mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -name '*.apk' -type f | sort)
        if [ "${#APKS[@]}" -ne 1 ]; then
          echo "::error::expected exactly one release APK in $APK_DIR, found ${#APKS[@]}: ${APKS[*]:-none}"
          ls -la "$APK_DIR" || true
          exit 1
        fi
        APK="${APKS[0]}"
        echo "Verifying $APK"

        # An unsigned APK must never be published as though it were a signed release.
        case "$APK" in
          *-unsigned.apk)
            echo "::error::$APK is unsigned — refusing to publish it as a signed release"
            exit 1
            ;;
        esac

        BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)

        # Android 17 requires 16 KB alignment, so the check has to ask for it:
        # `zipalign -c 4` only proves 4-byte alignment. `pipefail` (set above) keeps
        # zipalign's exit status authoritative through the `tail`.
        "${BT}zipalign" -c -P 16 -v 4 "$APK" | tail -3

        # Same rule for apksigner: its status must not be swallowed by the pipe.
        "${BT}apksigner" verify --print-certs "$APK" | tee apk-cert.txt
        RELEASE_SHA=$(grep -ioP 'certificate SHA-?256 digest: \K[0-9a-f]+' apk-cert.txt | head -1 | tr 'A-F' 'a-f' || true)
        if [ -z "$RELEASE_SHA" ]; then
          # Fallback via keytool directly on the archive, exactly like the AAB gate
          RELEASE_SHA=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
            | grep -oP 'SHA256: \K[0-9A-Fa-f:]+' | tr -d ':' | tr 'A-F' 'a-f' | head -1 || true)
        fi
        if [ -z "$RELEASE_SHA" ]; then
          echo "::error::apksigner and keytool reported no signer certificate — the APK is not signed"
          exit 1
        fi
        DEBUG_SHA=$(keytool -list -v -keystore keystore/debug.keystore -storepass android \
          -alias androiddebugkey | grep -oP 'SHA256: \K[0-9A-Fa-f:]+' | tr -d ':' | tr 'A-F' 'a-f')
        if [ -n "$DEBUG_SHA" ] && [ "$RELEASE_SHA" = "$DEBUG_SHA" ]; then
          echo "::error::the release APK is signed with the repository's debug key — never distribute this"
          exit 1
        fi
        echo "OK: signed by $RELEASE_SHA (not the debug key)."

        # Independent trust anchor: the signer must be the pinned production
        # certificate (2026-10 audit, Phase 3). "Not the debug key" alone would
        # accept any other certificate; this comparison does not.
        python3 scripts/verify_signing_identity.py --observed "$RELEASE_SHA"

        # Independent, content-hash based verification of the packaged model: the
        # bytes in the artifact must equal the verified source asset.
        python3 scripts/verify_release_artifact.py --kind apk --archive "$APK"

        # Verify MODEL_LICENSE.md is packaged inside APK assets and matches source
        unzip -p "$APK" assets/MODEL_LICENSE.md | cmp - MODEL_LICENSE.md || {
          echo "::error::assets/MODEL_LICENSE.md is missing or corrupt in release APK"
          exit 1
        }
        echo "OK: assets/MODEL_LICENSE.md verified inside release APK."

        unzip -p "$APK" assets/MODEL_NOTICE.md | cmp - MODEL_NOTICE.md || {
          echo "::error::assets/MODEL_NOTICE.md is missing or corrupt in release APK"
          exit 1
        }
        echo "OK: assets/MODEL_NOTICE.md verified inside release APK."

        # The §3 agreement must also travel as the verbatim upstream file, not
        # only as the paraphrase in MODEL_LICENSE.md. Path verified against a
        # real AAB/APK (base module assets -> assets/, base/assets/ in the AAB).
        unzip -p "$APK" assets/licenses/OpenMDW-1.1.txt | cmp - licenses/OpenMDW-1.1.txt || {
          echo "::error::assets/licenses/OpenMDW-1.1.txt is missing or corrupt in release APK"
          exit 1
        }
        echo "OK: assets/licenses/OpenMDW-1.1.txt verified inside release APK."

        echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

    - name: Verify bundled model hash (checkModels gate)
      run: ./gradlew checkModels

    - name: Build Release AAB (separate invocation)
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        set -euo pipefail
        ./gradlew bundleRelease

    - name: Verify release AAB (bundle signature and asset-pack delivery)
      run: |
        set -euo pipefail
        AAB_DIR=app/build/outputs/bundle/release
        mapfile -t AABS < <(find "$AAB_DIR" -maxdepth 1 -name '*.aab' -type f | sort)
        if [ "${#AABS[@]}" -ne 1 ]; then
          echo "::error::expected exactly one release AAB in $AAB_DIR, found ${#AABS[@]}: ${AABS[*]:-none}"
          ls -la "$AAB_DIR" || true
          exit 1
        fi
        AAB="${AABS[0]}"
        echo "Verifying $AAB"

        # An AAB is a JAR, not an APK: verify it with jarsigner. `jarsigner
        # -verify` exits 0 even for an unsigned bundle, so the output has to be
        # inspected rather than trusted.
        jarsigner -verify -certs "$AAB" > aab-verify.txt 2>&1 || {
          cat aab-verify.txt
          echo "::error::jarsigner failed on the app bundle"
          exit 1
        }
        if grep -q 'jar is unsigned' aab-verify.txt; then
          cat aab-verify.txt
          echo "::error::the app bundle is unsigned — refusing to publish it as a signed release"
          exit 1
        fi
        grep -q 'jar verified' aab-verify.txt || {
          cat aab-verify.txt
          echo "::error::jarsigner did not report a verified jar"
          exit 1
        }
        # `|| true` is load-bearing, exactly as in the APK step: keytool exits 0
        # for an archive that is not JAR-signed, so the *empty* result is the only
        # signal, and without the guard `set -euo pipefail` aborts on grep's
        # status before a single diagnostic is printed (verified empirically).
        BUNDLE_SHA=$(keytool -printcert -jarfile "$AAB" 2>/dev/null \
          | grep -oP 'SHA256: \K[0-9A-Fa-f:]+' | tr -d ':' | tr 'A-F' 'a-f' | head -1 || true)
        if [ -z "$BUNDLE_SHA" ]; then
          echo "::error::keytool reported no signer certificate for $AAB — the bundle is not JAR-signed, so its signing identity cannot be verified"
          exit 1
        fi
        DEBUG_SHA=$(keytool -list -v -keystore keystore/debug.keystore -storepass android \
          -alias androiddebugkey | grep -oP 'SHA256: \K[0-9A-Fa-f:]+' | tr -d ':' | tr 'A-F' 'a-f')
        if [ -n "$DEBUG_SHA" ] && [ "$BUNDLE_SHA" = "$DEBUG_SHA" ]; then
          echo "::error::the app bundle is signed with the repository's debug key — never distribute this"
          exit 1
        fi
        echo "OK: bundle signed by $BUNDLE_SHA (not the debug key)."

        # Independent trust anchor: same pinned production certificate as the APK
        # (equality between APK and AAB follows from both matching the pin).
        python3 scripts/verify_signing_identity.py --observed "$BUNDLE_SHA"

        # Proves the model is inside the :model_assets pack, exactly once, and not
        # duplicated into the base module (which would deliver ~750 MB twice).
        python3 scripts/verify_release_artifact.py --kind aab --archive "$AAB"

        # Verify MODEL_LICENSE.md is packaged inside AAB asset pack and matches source
        unzip -p "$AAB" model_assets/assets/MODEL_LICENSE.md | cmp - MODEL_LICENSE.md || {
          echo "::error::model_assets/assets/MODEL_LICENSE.md is missing or corrupt in release AAB"
          exit 1
        }
        echo "OK: model_assets/assets/MODEL_LICENSE.md verified inside release AAB."

        unzip -p "$AAB" model_assets/assets/MODEL_NOTICE.md | cmp - MODEL_NOTICE.md || {
          echo "::error::model_assets/assets/MODEL_NOTICE.md is missing or corrupt in release AAB"
          exit 1
        }
        echo "OK: model_assets/assets/MODEL_NOTICE.md verified inside release AAB."

        unzip -p "$AAB" base/assets/licenses/OpenMDW-1.1.txt | cmp - licenses/OpenMDW-1.1.txt || {
          echo "::error::base/assets/licenses/OpenMDW-1.1.txt is missing or corrupt in release AAB"
          exit 1
        }
        echo "OK: base/assets/licenses/OpenMDW-1.1.txt verified inside release AAB."

        echo "RELEASE_AAB=$AAB" >> "$GITHUB_ENV"

    - name: Extract Version Name
      id: extract_version
      run: |
        set -euo pipefail
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "Detected Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Rename Artifacts
      run: |
        set -euo pipefail
        cp "$RELEASE_APK" "Aura_Transcribe_v${{ env.VERSION_NAME }}.apk"
        cp "$RELEASE_AAB" "Aura_Transcribe_v${{ env.VERSION_NAME }}.aab"
        ls -lh "Aura_Transcribe_v${{ env.VERSION_NAME }}.apk" "Aura_Transcribe_v${{ env.VERSION_NAME }}.aab"

    - name: Print logs on failure
      if: failure()
      run: |
        cat gradle_lint.log || true
        cat gradle_alignment.log || true
        cat apk-cert.txt || true
        cat aab-verify.txt || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: Aura-Transcribe-v${{ env.VERSION_NAME }}-aab
        path: Aura_Transcribe_v${{ env.VERSION_NAME }}.aab

    # Only reached when every gate above passed: the APK is signed with the
    # project key (not the debug key), 16 KB aligned, and contains the bundled
    # model; the AAB is signed and delivers the same model once, in its asset pack.
    - name: Verify tag matches Gradle version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        set -e
        if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
          echo "::error::Pushed tag ${GITHUB_REF_NAME} does not match Gradle version v${VERSION_NAME}"
          exit 1
        fi

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        name: Aura Transcribe v${{ env.VERSION_NAME }}
        tag_name: v${{ env.VERSION_NAME }}
        body_path: RELEASE_NOTES.md
        prerelease: false
        draft: false
        make_latest: true
        files: |
