# Cargo cross-compilation flags for Android arm64-v8a (used by cargo-ndk).
# cargo-ndk configures the linker and C/C++ compilers automatically.

[target.aarch64-linux-android]
# 16 KB ELF page-size alignment (Android 15+ / 17) + ARMv8.2-A fp16/dotprod codegen
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-lc++_shared", "-C", "target-feature=+neon,+fp16,+dotprod"]
