[versions]
# Android Gradle Plugin aligned with the Android 17 (API 37) toolchain.
# AGP 8.13.x cannot resolve the API 37 platform (it is tested up to compile SDK
# 36.1 and fails with "Failed to find target with hash string 'android-37'"
# because it installs the platform as android-37.0 but looks for android-37),
# so the 9.x line is required for a genuine API 37 build.
agp = "9.4.1"
androidxCore = "1.19.1"
androidxAppcompat = "1.8.0"
androidxActivity = "1.13.0"
androidxWindow = "1.5.1"
material = "1.14.0"
okhttp = "4.12.0"
# 17.0.3 is the first release whose arm64-v8a libtranslate_jni.so is 16 KB
# page-size aligned. 17.0.2 ships a 4 KB-aligned ELF, which cannot be loaded on
# a 16 KB-page Android 17 device. Do not downgrade; checkNativeAlignment fails
# the build if this regresses.
mlkitTranslate = "17.0.3"
securityCrypto = "1.1.0-alpha06"
profileinstaller = "1.4.1"
junit = "4.13.2"
junitJupiter = "5.10.2"
json = "20240303"
kotlin = "1.8.22"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.0"
androidxBenchmark = "1.5.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-window = { module = "androidx.window:window", version.ref = "androidxWindow" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
material = { module = "com.google.android.material:material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
json = { module = "org.json:json", version.ref = "json" }
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-asset-pack = { id = "com.android.asset-pack", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
