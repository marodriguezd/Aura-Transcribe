org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 full mode is the default since AGP 8.0; stated explicitly so a future
# default flip cannot silently change release behaviour.
android.enableR8.fullMode=true

# JDK 17+ is required (AGP 9.4.1 / Gradle 9.8.0). If unset, Gradle uses JAVA_HOME.
#   /opt/android-studio/jbr          (Android Studio bundled JBR)
#   /usr/lib/jvm/java-17-openjdk     (System JDK 17)
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# The system AAPT2 override is only needed on ARM64 Linux hosts (e.g. a Termux/
# proot-distro environment) where the Maven AAPT2 binary cannot run. It is NOT
# set by default because the path is host-specific and, when set to a
# non-existent file, breaks every resource task. Uncomment and point it at your
# host's AAPT2 only if you hit "AAPT2 ... cannot be executed on this machine".
# android.aapt2FromMavenOverride=/usr/bin/aapt2
