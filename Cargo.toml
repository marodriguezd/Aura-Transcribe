[workspace]
members = [
    ".",
    "crates/aura-core",
]

[package]
name = "android_transcribe_app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
aura-core = { path = "crates/aura-core" }
cpal = "0.15"
log = "0.4"
android_logger = "0.13"
anyhow = "1.0"
transcribe-cpp = "0.1.3"
jni = "0.21"
libc = "0.2"
once_cell = "1.19"
crossbeam-channel = "0.5"
strsim = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
